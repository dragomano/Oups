name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Biome + svelte-check + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (svelte-check)
        run: pnpm check

      - name: Frontend tests (Vitest)
        run: pnpm test

      - name: Frontend build (vite)
        run: pnpm build

  rust:
    name: Rust (rustfmt + clippy + cargo test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check (rustfmt)
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests (cargo test)
        run: cargo test
        working-directory: src-tauri
