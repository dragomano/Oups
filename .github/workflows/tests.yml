name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Biome + svelte-check + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (svelte-check)
        run: pnpm check

      - name: Frontend tests (Vitest)
        run: pnpm test

      - name: Frontend build (vite)
        run: pnpm build

  # The Rust suite runs on every platform the app is bundled for, so a
  # platform-gated API (a Tauri method that only exists on Windows, for
  # example) fails here instead of in the Build workflow. The runners match the
  # bundle targets: Windows, Linux, macOS arm64 and macOS x86_64.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # The Linux runners need the Tauri system libraries before cargo can
      # build the webview bindings.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev
          librsvg2-dev libfuse2

      - name: Format check (rustfmt)
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests (cargo test)
        run: cargo test
        working-directory: src-tauri
